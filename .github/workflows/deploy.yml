# Ship the site whenever main moves.
#
# This is the auto-deploy path. Cloudflare also offers Workers Builds, configured in the dashboard
# rather than in the repo -- run one or the other, not both, or every merge deploys twice.
#
# Two repository secrets are required (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID from the Workers & Pages overview page
# Until both exist the job stops on the guard below with an explanatory message, rather than
# failing later inside wrangler with something cryptic.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer merge supersedes an in-flight deploy, but never cancel one half-way through.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # next build type-checks and writes the static export to ./out, which the Worker serves.
      - run: npm run build

      - name: Check the icons are even and centred
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 scripts/icon/validate-icons.py .

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.2'
          command: deploy
